name: homelab image

# Builds the homelab calibre-web image (LSIO base + this fork's source) and
# publishes it to GHCR. Triggered manually or on pushes to the branches we
# actually deploy from.
on:
  workflow_dispatch:
  push:
    branches:
      - master
      - custom-image
    paths:
      - 'cps/**'
      - 'cps.py'
      - 'requirements.txt'
      - 'optional-requirements.txt'
      - 'Dockerfile.homelab'
      - '.github/workflows/homelab-image.yml'

concurrency:
  group: homelab-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # sha tag is what the cluster pins to — immutable and traceable
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.homelab
          # calibre-web is pinned to the ubuntu-cloud2 node (amd64); add
          # linux/arm64 here if it ever moves to the Pi.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
